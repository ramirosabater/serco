[build]
  command = "npm run build"
  publish = "dist"

# La app maneja sus propias rutas (/manifiestos/123): todo va a index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Encabezados de seguridad (revisión del 25/10/2026)
#  - CSP: el sitio solo carga código propio; habla con Supabase y con Google Fonts.
#  - Referrer-Policy: el enlace del chofer (/subir/...) no se filtra a otros sitios.
#  - No se puede meter el sistema dentro de otra página (clickjacking).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self' blob:; frame-src 'self' blob: https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
